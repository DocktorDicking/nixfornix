<!-- header -->
<app-header></app-header>

<div class="d-flex align-items-stretch">
  <!-- menu -->
  <nav id="sidebar">
    <app-menu></app-menu>
  </nav>


  <!-- content -->
  <div class="page-content">
    <!-- page header -->
    <div class="page-header"> <!-- TODO: Move to separate component? -->
      <div class="container-fluid">
        <h2 class="h5 no-margin-bottom">Admin</h2>
      </div>
    </div>

    <app-hour-table *ngIf="state == 'OVERVIEW'"></app-hour-table>
    <app-manage-users *ngIf="state == 'MANAGE_USERS'"></app-manage-users>

    <app-footer></app-footer>
  </div>
</div>

<script>
  $('.sidebar-toggle').on('click', function () {
    $(this).toggleClass('active');

    $('#sidebar').toggleClass('shrinked');
    $('.page-content').toggleClass('active');
    $(document).trigger('sidebarChanged');

    if ($('.sidebar-toggle').hasClass('active')) {
      $('.navbar-brand .brand-sm').addClass('visible');
      $('.navbar-brand .brand-big').removeClass('visible');
      $(this).find('i').attr('class', 'fa fa-long-arrow-right');
    } else {
      $('.navbar-brand .brand-sm').removeClass('visible');
      $('.navbar-brand .brand-big').addClass('visible');
      $(this).find('i').attr('class', 'fa fa-long-arrow-left');
    }
  });
</script>
