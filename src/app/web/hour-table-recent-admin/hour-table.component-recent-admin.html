<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Recent geregistreerde uren door gebruikers</strong></div>
      <div class="table-responsive">
        <p *ngIf="this.times.length === 0 || this.times == null">
          Geen uren gevonden.
        </p>
        <table *ngIf="this.times.length > 0" class="table table-striped table-sm">
          <thead>
            <tr>
              <th class="form-control-label">Gebruiker</th>
              <th class="form-control-label">Datum</th>
              <th class="form-control-label">Begintijd</th>
              <th class="form-control-label">Eindtijd</th>
              <th class="form-control-label">Pauze</th>
              <th class="form-control-label">Uren</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let time of this.times" (click)="openTime(time)" class="htable-text">
              <td>{{time.user.name}}</td>
              <td>{{time.date}}</td>
              <td>{{time.start}}</td>
              <td>{{time.stop}}</td>
              <td>{{time.breaktime}}</td>
              <td>{{time.hour}}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th class="form-control-label">Gebruiker</th>
              <th class="form-control-label">Datum</th>
              <th class="form-control-label">Begintijd</th>
              <th class="form-control-label">Eindtijd</th>
              <th class="form-control-label">Pauze</th>
              <th class="form-control-label">Uren</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</section>
