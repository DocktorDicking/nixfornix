<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Recent geregistreerde uren</strong></div>
      <div class="table-responsive">
        <p *ngIf="this.times.length === 0 || this.times == null">
          Geen uren gevonden.
        </p>
        <table class="table table-striped table-sm" *ngIf="this.times.length > 0">
          <thead>
          <tr>
            <th class="form-control-label">Datum</th>
            <th class="form-control-label">Begintijd</th>
            <th class="form-control-label">Eindtijd</th>
            <th class="form-control-label">Pauze</th>
            <th class="form-control-label">Uren</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let time of this.times" class="htable-text">
            <td>{{time.date}}</td>
            <td>{{time.startTime}}</td>
            <td>{{time.stopTime}}</td>
            <td>{{time.break}}</td>
            <td>{{timeService.calculateWorkedHours(time)}}</td> <!-- TODO: Change to worked hours -->
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
