<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Logboek</strong></div>
      <div class="table-responsive">
        <table class="table table-sm" *ngIf="this.times.length > 0">
          <thead>
          <tr>
            <th class="form-control-label">Datum/Tijd</th>
            <th class="form-control-label">Omschrijving</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let time of this.times" class="htable-text">
            <!-- TODO: Change CSS so rows do now look like their are clickable -->
            <td>{{time.date | date:'dd-MM-yyyy'}}</td>
            <td>{{time.start | dlessShortTime}}</td>
            <td>{{time.stop | dlessShortTime}}</td>
            <td>{{time.hour}}</td>
            <td>{{time.breaktime}}</td>
            <td><i *ngIf="time.approved" class="fa fa-check-square-o"></i></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
