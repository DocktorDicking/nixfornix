<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Logboek</strong></div>
      <div class="table-responsive table-responsive-scrollable">
        <table class="table table-striped table-responsive-lg" *ngIf="this.logData.length > 0">
          <thead>
          <tr>
            <th class="form-control-label">Datum/Tijd</th>
            <th class="form-control-label">Omschrijving</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let data of this.logData" class="htable-text">
            <td style="width: 20%">{{data.createdAt | date:'dd-MM-yyyy HH:mm'}}</td>
            <td style="width: 80%">{{data.description}}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
