<section class="no-padding-bottom">
  <div class="col-lg-6 centerCol6">
    <div class="block">
      <div class="title"><strong class="d-block">Uren registreren</strong><span class="d-block"></span></div>
      <div class="block-body">
        <form>
          <div class="form-group">
            <label class="form-control-label">Datum</label>
            <input type="date" placeholder="Datum" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-control-label">Begintijd</label>
            <input type="time"  placeholder="Tijd" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-control-label">Eindtijd</label>
            <input type="time"  placeholder="Tijd" class="form-control" >
          </div>
          <div class="form-group">
            <label class="form-control-label">Pauze ?</label>
            <input type=""  placeholder="Tijd" class="form-control">
          </div>
          <div class="form-group row">
            <label class="col-sm-3 form-control-label">Locatie</label>
            <div class="col-sm-9 select">
              <select name="account" class="form-control mb-3">
                <option>Luca catering</option>
                <option>DKA</option>
                <option>Anders</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-control-label">Anders</label>
            <input type="text"  placeholder="Anders.." class="form-control">
          </div>
          <div class="form-group">
            <label class="form-control-label">Opmering</label>
            <input type="text"  placeholder="Opmerking" class="form-control">
          </div>

          <div class="form-group">
            <input type="submit" value="Registreren" class="btn btn-primary">
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
