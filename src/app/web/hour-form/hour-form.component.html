<section class="no-padding-bottom">
  <div class="col-lg-6 centerCol6">
    <div class="block">
      <div class="title"><strong class="d-block">Uren registreren</strong><span class="d-block"></span></div>
      <div class="block-body">
        <form>
          <div class="form-group">
            <label class="form-control-label">Datum</label>
            <input [(ngModel)]="time.date" name="date" type="date" placeholder="Datum" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-control-label">Begintijd</label>
            <input [(ngModel)]="time.startTime" name="startTime" type="time"  placeholder="Tijd" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-control-label">Eindtijd</label>
            <input [(ngModel)]="time.stopTime" name="stopTime" type="time"  placeholder="Tijd" class="form-control" >
          </div>
          <div class="form-group">
            <label class="col-sm-3 form-control-label">Pauze?</label>
            <div class="col-sm-9 select">
              <select [(ngModel)]="time.break" name="break" class="form-control mb-3">
                <option [ngValue]="true">Ja</option>
                <option [ngValue]="false">Nee</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 form-control-label">Locatie</label>
            <div class="col-sm-9 select">
              <select [(ngModel)]="time.location" name="location" class="form-control mb-3">
                <option [ngValue]="'Luca Catering'">Luca catering</option>
                <option [ngValue]="'DKA'">DKA</option>
                <option [ngValue]="'Anders'">Anders</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-control-label">Omschrijving</label>
            <input [(ngModel)]="time.description" type="text" name="description" placeholder="(optioneel)" class="form-control">
          </div>

          <div class="form-group">
            <input (click)="onRegisterTime()" type="submit" value="Registreren" class="btn btn-primary">
          </div>
          <!-- TODO: REMOVE AFTER TESTING -->
          <p>Test data time object en times array</p>
          <p>datum: {{time.date}}</p>
          <p>starttijd: {{time.startTime}}</p>
          <p>stoptijd: {{time.stopTime}}</p>
          <p>pauze?: {{time.break}}</p>
          <p>locatie: {{time.location}}</p>
          <p>omschrijving: {{time.description}}</p>
          <p>Aantal time objecten in array: {{times.length}}</p>
        </form>
      </div>
    </div>
  </div>
</section>
