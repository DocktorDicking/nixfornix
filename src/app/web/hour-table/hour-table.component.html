<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Uren overzicht</strong></div>
      <div class="table-responsive">
        <table class="table table-striped table-sm">
          <thead>
          <tr>
            <th class="form-control-label">Datum</th>
            <th class="form-control-label">Begintijd</th>
            <th class="form-control-label">Eindtijd</th>
            <th class="form-control-label">Pauze</th>
            <th class="form-control-label">Uren</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let time of this.times" class="htable-text">
            <td>{{time.date}}</td>
            <td>{{time.startTime}}</td>
            <td>{{time.stopTime}}</td>
            <td>{{time.break}}</td>
            <td>{{time.break}}</td> <!-- TODO: Change to worked hours -->
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
