<section class="no-padding-bottom">
  <div class="col-lg-12">
    <div class="block">
      <div class="title"><strong>Recent geregistreerde uren</strong></div>
      <div class="table-responsive">
        <p *ngIf="this.times.length === 0 || this.times == null">
          Geen uren gevonden.
        </p>
        <table class="table table-striped table-sm" *ngIf="this.times.length > 0">
          <thead>
          <tr>
            <th class="form-control-label">Datum</th>
            <th class="form-control-label">Begintijd</th>
            <th class="form-control-label">Eindtijd</th>
            <th class="form-control-label">Pauze</th>
            <th class="form-control-label">Uren</th>
            <th class="form-control-label"></th>
          </tr>
          </thead>
          <tbody>
            <tr *ngFor="let time of this.times" class="htable-text"><!-- TODO: Change CSS so rows do now look like their are clickable -->
              <td>{{time.date | date:'dd-MM-yyyy'}}</td>
              <td>{{time.start}}</td>
              <td>{{time.stop}}</td>
              <td>{{time.breaktime}}</td>
              <td>{{time.hour}}</td>
              <td><i *ngIf="time.approved" class="fa fa-check-square-o"></i></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
