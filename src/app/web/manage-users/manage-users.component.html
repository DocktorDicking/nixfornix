<section class="no-padding-bottom">
  <div class="row">
    <div class="col-md-4">
      <div class="block">
        <div class="title">
          <strong>Geregistreerde gebruikers</strong>
        </div>
          <div *ngIf="this.userService.users.length > 0">
            <div class="table-responsive">
              <table class="table table-striped table-sm">
                <thead>
                  <tr>
                    <th class="form-control-label">Naam</th>
                    <th class="form-control-label">Rol</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let user of this.userService.users" class="htable-text" (click)="onUserData(user.id)">
                    <td>{{user.fullName}}</td>
                    <td>{{user.admin ? 'Administrator' : 'Werknemer'}}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div *ngIf="this.userService.users.length < 1">
            Er zijn geen gebruikers gevonden.
          </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="block">
        <div class="title"><strong>Toevoegen/Aanpassen</strong></div>
        <form #userForm="ngForm" (ngSubmit)="onSave()">
          <div class="form-group">
            <label for="firstName" class="form-control-label">Voornaam</label>
            <input [(ngModel)]="this.formUser.firstName" #firstName="ngModel" id="firstName" name="firstName" type="firstName" class="form-control">
            <!-- Error messages -->
            <div class="alert-text">
              <div *ngIf="firstName.invalid && firstName.touched" class="shakeIt">
                <div *ngIf="firstName.errors.required">
                  Dit veld mag niet leeg zijn.
                </div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="middleName" class="form-control-label">Tussenvoegsel</label>
            <input [(ngModel)]="this.formUser.middleName" #middleName="ngModel" id="middleName" name="middleName" type="text" class="form-control">
            <!-- Error messages -->
            <div class="alert-text">
              <div *ngIf="middleName.invalid && middleName.touched" class="shakeIt">
                <!-- TODO -->
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="lastName" class="form-control-label">Achternaam</label>
            <input [(ngModel)]="this.formUser.lastName" #lastName="ngModel" id="lastName" name="lastName" type="text" class="form-control">
            <!-- Error messages -->
            <div class="alert-text">
              <div *ngIf="lastName.invalid && lastName.touched" class="shakeIt">
                <!-- TODO -->
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-control-label">Email</label>
            <input [(ngModel)]="this.formUser.email" #email="ngModel" id="email" name="email" type="email" class="form-control">
            <!-- Error messages -->
            <div class="alert-text">
              <div *ngIf="email.invalid && email.touched" class="shakeIt">
                <!-- TODO -->
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-control-label">Wachtwoord</label>
            <input [(ngModel)]="this.formUser.password" #password="ngModel" id="password" name="password" type="password" class="form-control">
            <!-- Error messages -->
            <div class="alert-text">
              <div *ngIf="password.invalid && password.touched" class="shakeIt">
                <!-- TODO -->
              </div>
            </div>
          </div>

          <!-- Error messages -->
          <div class="alert-text">
            <div *ngIf="this.message" class="shakeIt">
              <p [textContent]="this.message"></p>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Registreren</button>
          <button type="reset" class="btn btn-dark" (click)="resetFormUser()">Reset</button>
        </form>
      </div>
    </div>
  </div>
</section>
